name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python-tests:
    name: Python tests (allowlist guard + tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (incl. dev)
        run: uv sync
      - name: Run test suite
        run: uv run pytest tests/ -v

  go-build:
    name: Go bridge builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
      - name: Build bridge
        run: go build -o /dev/null .
